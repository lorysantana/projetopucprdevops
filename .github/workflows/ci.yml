name: CI - Integracao Continua
on:
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Verificar integridade do build (React)
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do backend
        working-directory: backend
        run: npm install

      - name: Verificar sintaxe dos arquivos do backend
        working-directory: backend
        run: |
          for file in $(find src -name "*.js"); do
            node --check "$file"
          done

      - name: Testar inicializacao da API
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          SEED_ADMIN_EMAIL: admin@empresa.com
          SEED_ADMIN_PASSWORD: Admin@123
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:3001/api/health
          kill $SERVER_PID
